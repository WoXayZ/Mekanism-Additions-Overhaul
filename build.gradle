plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.36'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'mekanismadditionsoverhaul'
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${minecraft_version}-1.0"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    flatDir {
        dirs(
                'C:/Users/cdaguenet/curseforge/minecraft/Instances/Evolved Mekanism/mods',
                'C:/Users/cdaguenet/curseforge/minecraft/Instances/Blackstone Block Renewed/mods',
                'C:/Users/cdaguenet/curseforge/minecraft/Instances/Biotaxia Expert/mods',
                'C:/Users/cdaguenet/curseforge/minecraft/Instances/backup/BExpert/mods'
        )
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // flatDir names match the jar filenames. fg.deobf remaps SRG jars to official names so their mixins load in runClient.
    implementation fg.deobf('local:Mekanism-1.20.1:10.4.16.80')
    implementation fg.deobf('local:MekanismAdditions-1.20.1:10.4.16.80')
    implementation fg.deobf('local:geckolib-forge-1.20.1:4.7.2')
    implementation fg.deobf('local:resourcefullib-forge-1.20.1:2.1.29')
    implementation fg.deobf('local:resourcefulconfig-forge-1.20.1:2.1.3')
    implementation fg.deobf('local:creeperoverhaul-3.0.2:forge')
    implementation fg.deobf('local:endermanoverhaul-forge-1.20.1:1.0.4')
    implementation fg.deobf('local:jei-1.20.1-forge:15.56.0.205')
}

def clearDevMods = tasks.register('clearDevMods', Delete) {
    delete layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' || it.name == 'prepareRuns' }.configureEach {
    dependsOn clearDevMods
    dependsOn 'createSrgToMcp'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replacements = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'MixinConfigs': 'mekanismadditionsoverhaul.mixins.json'
        ])
    }
}

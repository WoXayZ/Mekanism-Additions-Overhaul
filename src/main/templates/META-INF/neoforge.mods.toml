modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[mixins]]
config = "mekanismadditionsoverhaul.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
type = "required"
versionRange = "[10.7.19,11)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanismadditions"
type = "required"
versionRange = "[10.7.19,11)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "optional"
versionRange = "[4.9,5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "creeperoverhaul"
type = "optional"
versionRange = "[4.0.6,5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "endermanoverhaul"
type = "optional"
versionRange = "[2.0.3,3)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "spider_overhaul"
type = "optional"

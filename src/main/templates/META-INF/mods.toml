modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[mixins]]
config = "mekanismadditionsoverhaul.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
mandatory = true
versionRange = "[10.4.16,10.5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanismadditions"
mandatory = true
versionRange = "[10.4.16,10.5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = false
versionRange = "[4.7.2,4.8)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "creeperoverhaul"
mandatory = false
versionRange = "[3.0.2,4)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
